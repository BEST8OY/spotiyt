[project]
name = "spotiyt"
version = "1.0.0"
description = "Export Spotify playlists and synchronize them with YouTube Music"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "best8oy" }]
requires-python = ">=3.8"
dependencies = [
    "pyotp>=2.8.0",
    "requests>=2.28.0",
    "ytmusicapi>=1.5.0",
    "rich>=13.0.0",
]

[project.scripts]
spotiyt = "spotiyt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
