[project]
name = "spotiyt"
version = "1.0.0"
description = "Export Spotify playlists and synchronize them with YouTube Music"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "best8oy" }]
requires-python = ">=3.10"
dependencies = [
    "pyotp>=2.8.0",
    "requests>=2.28.0",
    "ytmusicapi>=1.5.0",
    "rich>=13.0.0",
    "textual>=0.73.0",
]

[project.scripts]
spotiyt = "spotiyt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["spotiyt", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "TID",    # flake8-tidy-imports
    "PGH",    # pygrep-hooks
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator simplification
    "RUF001", # ambiguous unicode characters (intentional CLI badges / icons)
    "RUF002", # ambiguous docstring characters
    "RUF003", # ambiguous comment characters
    "RUF012", # mutable class attributes (Textual BINDINGS)
]

[tool.ruff.lint.isort]
known-first-party = ["spotiyt"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]



